[package]
name = "src"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = "0.8.1"

# gpui-pre-macos 0.3.10 uses `Option::map_or_default`, which is unstable on
# stable Rust. Use a local copy with the stable equivalent instead.
[patch.crates-io]
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }